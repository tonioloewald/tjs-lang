name: CI

# There was no CI on this repo until 0.13.0. Everything was enforced by local
# git hooks, which is fine right up until someone pushes from a machine where
# `prepare` never ran — and it meant a whole class of rot (six test files that
# imported a removed runner and therefore silently never ran, for several
# releases) had nothing watching for it.
#
# Deliberately NOT the full suite. `bun test` needs a local model server, so
# running it here would be red for a reason that isn't the code — and a red CI
# people learn to ignore is worse than none. The full lane stays enforced by
# `.githooks/pre-push` on tag pushes, where a human is present to warm the
# server. See CLAUDE.md → "Full run before tagging".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Ordered cheapest-first so an obvious failure reports in seconds, but
      # every step runs regardless (`if: always()`): three separate findings in
      # one run beats fix-push-wait three times.
      - name: Typecheck
        if: always()
        run: bun run typecheck

      - name: Lint
        if: always()
        run: bun run lint

      - name: Format
        if: always()
        run: bun run format:check

      # BEFORE the tests, not after. Three guards are gated on `dist/` existing
      # (`bundle-size.test.ts` x2, `resolve.test.ts`'s built-worker anti-drift
      # smoke) and on a fresh clone they silently SKIPPED here — 25 pass / 3 skip
      # where a local run gets 28. A guard that skips reports the same green as a
      # guard that passes. The README bundle-size drift these exist to catch was
      # caught by the pre-push tag hook instead, where `dist/` happens to exist.
      #
      # The committed build artifacts (editors/*.js, the TextMate grammars,
      # demo/docs.json) are checked in so `npm publish` ships them without a
      # build — which means editing a source file without rebuilding silently
      # ships stale output. Their guards live in the suite below; this proves the
      # build that produces them still runs at all.
      - name: Build
        if: always()
        run: bun run make

      # SKIP_LLM_TESTS + SKIP_BENCHMARKS + SKIP_AUDIT — the model server and the
      # advisory feed are both unavailable here. `bun audit` runs in the pre-tag
      # lane instead, where the network is real.
      #
      # Runs AFTER the build so the `dist/`-gated guards actually execute.
      # `bundle-size.test.ts` asserts that they did whenever CI is set, so a
      # future reorder fails loudly instead of going quiet.
      - name: Test (fast lane)
        if: always()
        run: bun run test:fast

      # The dogfood ratchets, in their OWN lane because they must not be skipped.
      #
      # Both gate on `SKIP_BENCHMARKS`, which `test:fast` sets and this workflow inherits,
      # so neither has ever run in CI — which is how the pre-tag gate went red for a whole
      # round with nothing saying so, and how nine "undiagnosed" conversion failures sat on
      # a ratchet list for weeks after one fix would have closed them. A gate nobody runs is
      # not a gate.
      #
      # Kept out of `test:fast` rather than un-gated there: together they are ~50s against
      # that lane's ~25s, and tripling the inner loop is how a fast lane stops being used.
      - name: Dogfood ratchets
        if: always()
        run: bun run test:dogfood

      # `make` REGENERATES committed artifacts, so running it and not looking at
      # the result proves only that the build does not crash. `demo/docs.json`
      # was demonstrably stale at 0.13.0-beta.1 — twelve documents behind HEAD,
      # shipping claims the repo had already corrected — with this exact step
      # running green above it.
      #
      # `code-quality.md` and `state-and-schema.md` both prescribe
      # `git diff --exit-code` on the generated set. This is that.
      - name: Generated artifacts are current
        if: always()
        run: |
          if ! git diff --exit-code -- \
            demo/docs.json \
            docs/tjs-vs-typescript.md \
            'editors/**/*.js' \
            'editors/**/*.d.ts' \
            editors/vscode/syntaxes; then
            echo "::error::'bun run make' changed committed artifacts. Run it locally and commit the result."
            exit 1
          fi
